<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Community | LEHULA Trading Hub</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<header class="topbar">

    <div class="brand">

        <div class="logo">
            L25
        </div>

        <div>

            <div class="brand-main">
                LEHULA
            </div>

            <div class="brand-sub">
                TRADING HUB
            </div>

        </div>

    </div>


    <a
        href="dashboard.html"
        class="back-button"
    >
        ←
    </a>

</header>



<main class="community-page">


    <!-- COMMUNITY HEADER -->

    <section class="community-header">

        <div class="community-label">
            👥 LEHULA COMMUNITY
        </div>

        <h1>
            TRADING COMMUNITY.
        </h1>

        <p>
            Connect with traders, share ideas and learn together.
        </p>

    </section>



    <!-- CREATE POST -->

    <section class="community-create">

        <div class="community-create-title">
            CREATE A POST
        </div>


        <textarea
            id="post-content"
            maxlength="1000"
            placeholder="What's happening in the markets?"
        ></textarea>


        <!-- PHOTO PREVIEW -->

        <div
            id="photo-preview-container"
            class="photo-preview-container"
            style="display:none;"
        >

            <img
                id="photo-preview"
                class="photo-preview"
                src=""
                alt="Selected image"
            >

            <button
                id="remove-photo"
                class="remove-photo"
                type="button"
            >
                ×
            </button>

        </div>



        <!-- CREATE POST ACTIONS -->

        <div class="community-create-bottom">


            <div class="create-post-tools">

                <label
                    for="photo-input"
                    class="add-photo-button"
                >
                    📷 ADD PHOTO
                </label>

                <input
                    id="photo-input"
                    type="file"
                    accept="image/*"
                    hidden
                >


                <span id="character-count">
                    0 / 1000
                </span>

            </div>


            <button
                id="post-button"
            >
                POST
            </button>

        </div>


        <div id="post-message"></div>

    </section>



    <!-- FEED -->

    <section class="community-section">

        <div class="community-section-title">
            LATEST DISCUSSIONS
        </div>


        <div id="community-feed">

            <div class="community-loading">
                Loading community...
            </div>

        </div>

    </section>


</main>



<script src="Script.js"></script>


<script>


/* =========================================================
   ELEMENTS
========================================================= */

const postContent =
    document.getElementById(
        "post-content"
    );


const characterCount =
    document.getElementById(
        "character-count"
    );


const postButton =
    document.getElementById(
        "post-button"
    );


const postMessage =
    document.getElementById(
        "post-message"
    );


const communityFeed =
    document.getElementById(
        "community-feed"
    );


const photoInput =
    document.getElementById(
        "photo-input"
    );


const photoPreviewContainer =
    document.getElementById(
        "photo-preview-container"
    );


const photoPreview =
    document.getElementById(
        "photo-preview"
    );


const removePhotoButton =
    document.getElementById(
        "remove-photo"
    );


let currentUser = null;

let selectedImageFile = null;



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (!value) return "";

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================================================
   TIME
========================================================= */

function formatTime(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleString([], {
        dateStyle: "medium",
        timeStyle: "short"
    });

}



/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if (error || !user) {

        window.location.href =
            "index.html";

        return;

    }


    currentUser = user;

}



/* =========================================================
   PHOTO SELECT
========================================================= */

photoInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        /* Maximum 10 MB */

        if (
            file.size >
            10 * 1024 * 1024
        ) {

            alert(
                "Please choose an image smaller than 10 MB."
            );

            photoInput.value = "";

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Please select an image file."
            );

            photoInput.value = "";

            return;

        }


        selectedImageFile =
            file;


        const imageURL =
            URL.createObjectURL(
                file
            );


        photoPreview.src =
            imageURL;


        photoPreviewContainer.style.display =
            "block";

    }
);



/* =========================================================
   REMOVE PHOTO
========================================================= */

removePhotoButton.addEventListener(
    "click",
    () => {

        selectedImageFile =
            null;

        photoInput.value =
            "";

        photoPreview.src =
            "";

        photoPreviewContainer.style.display =
            "none";

    }
);



/* =========================================================
   LOAD POSTS
========================================================= */

async function loadPosts() {


    communityFeed.innerHTML = `
        <div class="community-loading">
            Loading community...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("community_posts")
            .select(`
                id,
                content,
                image_url,
                created_at,
                user_id,
                profiles (
                    username,
                    full_name,
                    avatar_url,
                    avatar_emoji
                )
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        communityFeed.innerHTML = `
            <div class="community-error">
                Unable to load community posts.
            </div>
        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        communityFeed.innerHTML = `
            <div class="community-empty">
                No posts yet.<br>
                Be the first trader to start a discussion.
            </div>
        `;

        return;

    }


    communityFeed.innerHTML = "";


    for (const post of data) {

        await createPostCard(
            post
        );

    }

}



/* =========================================================
   CREATE POST CARD
========================================================= */

async function createPostCard(
    post
) {


    const profile =
        post.profiles || {};


    let avatarHTML =
        "";


    if (
        profile.avatar_url
    ) {

        avatarHTML = `
            <img
                src="${escapeHTML(
                    profile.avatar_url
                )}"
                alt="Profile"
            >
        `;

    }

    else if (
        profile.avatar_emoji
    ) {

        avatarHTML =
            escapeHTML(
                profile.avatar_emoji
            );

    }

    else {

        avatarHTML =
            "👤";

    }


    const fullName =
        profile.full_name ||
        profile.username ||
        "Trader";


    const username =
        profile.username ||
        "";



    /* =========================
       LIKES
    ========================= */

    const {
        data: likes,
        error: likesError
    } =
        await supabaseClient
            .from(
                "community_likes"
            )
            .select(
                "user_id"
            )
            .eq(
                "post_id",
                post.id
            );


    if (likesError) {

        console.error(
            likesError
        );

    }


    const likeList =
        likes || [];


    const likeCount =
        likeList.length;


    const userLiked =
        likeList.some(
            like =>
                like.user_id ===
                currentUser.id
        );



    /* =========================
       IMAGE
    ========================= */

    let imageHTML = "";


    if (post.image_url) {

        imageHTML = `

            <div class="community-post-image">

                <img
                    src="${escapeHTML(
                        post.image_url
                    )}"
                    alt="Community post image"
                    loading="lazy"
                >

            </div>

        `;

    }



    /* =========================
       POST ELEMENT
    ========================= */

    const postElement =
        document.createElement(
            "article"
        );


    postElement.className =
        "community-post";


    postElement.innerHTML = `


        <div class="community-post-header">


            <div class="community-avatar">

                ${avatarHTML}

            </div>


            <div class="community-user">

                <div class="community-name">

                    ${escapeHTML(
                        fullName
                    )}

                </div>


                <div class="community-username">

                    ${
                        username
                        ? "@" +
                          escapeHTML(
                              username
                          )
                        : ""
                    }

                </div>


                <div class="community-time">

                    ${formatTime(
                        post.created_at
                    )}

                </div>

            </div>


        </div>



        <div class="community-post-content">

            ${
                post.content
                ? escapeHTML(
                    post.content
                ).replace(
                    /\n/g,
                    "<br>"
                )
                : ""
            }

        </div>



        ${imageHTML}



        <div class="community-post-actions">


            <button
                class="post-action like-button ${
                    userLiked
                    ? "liked"
                    : ""
                }"
                data-post-id="${post.id}"
            >

                <span class="like-icon">

                    ${
                        userLiked
                        ? "❤️"
                        : "♡"
                    }

                </span>


                <span class="like-text">
                    Like
                </span>


                <span class="like-count">

                    ${likeCount}

                </span>

            </button>



            <button
                class="post-action comment-toggle"
                data-post-id="${post.id}"
            >

                💬 Comment

            </button>


        </div>



        <div
            class="comments-area"
            id="comments-${post.id}"
        >

            <div class="comments-loading">
                Loading comments...
            </div>

        </div>


    `;


    communityFeed.appendChild(
        postElement
    );



    await loadComments(
        post.id
    );



    const likeButton =
        postElement.querySelector(
            ".like-button"
        );


    likeButton.addEventListener(
        "click",
        () => {

            toggleLike(
                post.id,
                likeButton
            );

        }
    );



    const commentButton =
        postElement.querySelector(
            ".comment-toggle"
        );


    commentButton.addEventListener(
        "click",
        () => {

            const commentsArea =
                document.getElementById(
                    `comments-${post.id}`
                );


            const input =
                commentsArea.querySelector(
                    ".comment-input"
                );


            if (input) {

                input.focus();

            }

        }
    );

}



/* =========================================================
   LIKE / UNLIKE
========================================================= */

async function toggleLike(
    postId,
    button
) {


    button.disabled =
        true;


    const {
        data: existingLike,
        error: checkError
    } =
        await supabaseClient
            .from(
                "community_likes"
            )
            .select(
                "id"
            )
            .eq(
                "post_id",
                postId
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if (checkError) {

        console.error(
            checkError
        );

        button.disabled =
            false;

        return;

    }


    if (existingLike) {


        const {
            error
        } =
            await supabaseClient
                .from(
                    "community_likes"
                )
                .delete()
                .eq(
                    "id",
                    existingLike.id
                );


        if (error) {

            console.error(
                error
            );

            button.disabled =
                false;

            return;

        }

    }


    else {


        const {
            error
        } =
            await supabaseClient
                .from(
                    "community_likes"
                )
                .insert({

                    post_id:
                        postId,

                    user_id:
                        currentUser.id

                });


        if (error) {

            console.error(
                error
            );

            button.disabled =
                false;

            return;

        }

    }



    const {
        count,
        error: countError
    } =
        await supabaseClient
            .from(
                "community_likes"
            )
            .select(
                "id",
                {
                    count:
                        "exact",
                    head:
                        true
                }
            )
            .eq(
                "post_id",
                postId
            );


    if (!countError) {

        const countElement =
            button.querySelector(
                ".like-count"
            );


        countElement.textContent =
            count || 0;

    }



    const icon =
        button.querySelector(
            ".like-icon"
        );


    if (existingLike) {

        button.classList.remove(
            "liked"
        );

        icon.textContent =
            "♡";

    }

    else {

        button.classList.add(
            "liked"
        );

        icon.textContent =
            "❤️";

    }


    button.disabled =
        false;

}



/* =========================================================
   LOAD COMMENTS
========================================================= */

async function loadComments(
    postId
) {


    const commentsArea =
        document.getElementById(
            `comments-${postId}`
        );


    const {
        data,
        error
    } =
        await supabaseClient
            .from(
                "community_comments"
            )
            .select(`
                id,
                content,
                created_at,
                user_id,
                profiles (
                    username,
                    full_name,
                    avatar_url,
                    avatar_emoji
                )
            `)
            .eq(
                "post_id",
                postId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            error
        );

        commentsArea.innerHTML = `
            <div class="comments-error">
                Unable to load comments.
            </div>
        `;

        return;

    }


    let commentsHTML =
        "";


    if (
        !data ||
        data.length === 0
    ) {

        commentsHTML = `
            <div class="no-comments">
                No comments yet.
            </div>
        `;

    }

    else {

        commentsHTML =
            data.map(
                comment => {


                    const profile =
                        comment.profiles ||
                        {};


                    let avatarHTML =
                        "";


                    if (
                        profile.avatar_url
                    ) {

                        avatarHTML = `
                            <img
                                src="${escapeHTML(
                                    profile.avatar_url
                                )}"
                                alt="Profile"
                            >
                        `;

                    }

                    else if (
                        profile.avatar_emoji
                    ) {

                        avatarHTML =
                            escapeHTML(
                                profile.avatar_emoji
                            );

                    }

                    else {

                        avatarHTML =
                            "👤";

                    }


                    const name =
                        profile.full_name ||
                        profile.username ||
                        "Trader";


                    return `

                        <div class="community-comment">


                            <div class="comment-avatar">

                                ${avatarHTML}

                            </div>


                            <div class="comment-body">


                                <div class="comment-user">

                                    ${escapeHTML(
                                        name
                                    )}

                                </div>


                                <div class="comment-text">

                                    ${escapeHTML(
                                        comment.content
                                    ).replace(
                                        /\n/g,
                                        "<br>"
                                    )}

                                </div>


                                <div class="comment-time">

                                    ${formatTime(
                                        comment.created_at
                                    )}

                                </div>


                            </div>


                        </div>

                    `;

                }
            ).join("");

    }



    commentsArea.innerHTML = `

        <div class="comments-list">

            ${commentsHTML}

        </div>


        <div class="comment-form">


            <input
                type="text"
                class="comment-input"
                placeholder="Write a comment..."
                maxlength="500"
            >


            <button
                class="comment-submit"
                data-post-id="${postId}"
            >
                SEND
            </button>


        </div>

    `;



    const submitButton =
        commentsArea.querySelector(
            ".comment-submit"
        );


    const input =
        commentsArea.querySelector(
            ".comment-input"
        );


    submitButton.addEventListener(
        "click",
        () => {

            addComment(
                postId,
                input
            );

        }
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                addComment(
                    postId,
                    input
                );

            }

        }
    );

}



/* =========================================================
   ADD COMMENT
========================================================= */

async function addComment(
    postId,
    input
) {


    const content =
        input.value.trim();


    if (!content) {

        input.focus();

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from(
                "community_comments"
            )
            .insert({

                post_id:
                    postId,

                user_id:
                    currentUser.id,

                content:
                    content

            });


    if (error) {

        console.error(
            error
        );

        alert(
            "Unable to add comment."
        );

        return;

    }


    input.value =
        "";


    await loadComments(
        postId
    );

}



/* =========================================================
   CREATE POST
========================================================= */

postContent.addEventListener(
    "input",
    () => {

        characterCount.textContent =
            `${postContent.value.length} / 1000`;

    }
);



postButton.addEventListener(
    "click",
    async () => {


        const content =
            postContent.value.trim();


        if (
            !content &&
            !selectedImageFile
        ) {

            postMessage.textContent =
                "Write something or add a photo first.";

            return;

        }


        postButton.disabled =
            true;


        postButton.textContent =
            "POSTING...";


        postMessage.textContent =
            "";



        /* =========================
           IMAGE URL
        ========================= */

        let imageUrl =
            null;



        if (selectedImageFile) {


            const extension =
                selectedImageFile
                    .name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const filePath =
                `${currentUser.id}/${crypto.randomUUID()}.${extension}`;


            const {
                error:
                    uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        "community-media"
                    )
                    .upload(
                        filePath,
                        selectedImageFile,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                selectedImageFile.type
                        }
                    );


            if (uploadError) {

                console.error(
                    uploadError
                );

                alert(
                    "Unable to upload photo."
                );

                postButton.disabled =
                    false;

                postButton.textContent =
                    "POST";

                return;

            }


            const {
                data:
                    publicData
            } =
                supabaseClient
                    .storage
                    .from(
                        "community-media"
                    )
                    .getPublicUrl(
                        filePath
                    );


            imageUrl =
                publicData.publicUrl;

        }



        /* =========================
           CREATE DATABASE POST
        ========================= */

        const {
            error
        } =
            await supabaseClient
                .from(
                    "community_posts"
                )
                .insert({

                    user_id:
                        currentUser.id,

                    content:
                        content ||
                        "",

                    image_url:
                        imageUrl

                });


        if (error) {

            console.error(
                error
            );

            alert(
                "Unable to create post."
            );

            postButton.disabled =
                false;

            postButton.textContent =
                "POST";

            return;

        }



        /* =========================
           RESET
        ========================= */

        postContent.value =
            "";

        characterCount.textContent =
            "0 / 1000";


        selectedImageFile =
            null;


        photoInput.value =
            "";


        photoPreview.src =
            "";


        photoPreviewContainer.style.display =
            "none";


        postMessage.textContent =
            "Post published successfully.";


        postButton.disabled =
            false;


        postButton.textContent =
            "POST";


        await loadPosts();

    }
);



/* =========================================================
   START
========================================================= */

async function startCommunity() {

    await loadCurrentUser();


    if (!currentUser) {

        return;

    }


    await loadPosts();

}


startCommunity();


</script>


</body>

</html>
