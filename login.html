<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LEHULA Trading Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">L25</div>

    <div class="brand">
        <h1>LEHULA</h1>
        <p>TRADING HUB</p>
    </div>

    <button class="menu">☰</button>
</header>

<main>

    <section class="hero">
        <p class="country">🇱🇸 LESOTHO FX TRADING</p>

        <h2>
            WELCOME <br>
            <span>BACK.</span>
        </h2>

        <p class="description">
            Login to access your trading dashboard, journal,
            risk management tools and learning resources.
        </p>

        <div class="auth-box">

            <form id="login-form">

                <input
                    type="email"
                    id="login-email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="primary">
                    LOGIN
                </button>

            </form>

            <p id="login-status"></p>

            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>

    </section>

</main>

<footer>
    <p>LEHULA TRADING HUB © 2026</p>
    <p>Lesotho FX Trading to the World 🌍</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Script.js"></script>

<script>

document
    .getElementById("login-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("login-email").value.trim();

        const password =
            document.getElementById("login-password").value;

        const status =
            document.getElementById("login-status");

        status.textContent = "🟡 Logging in...";

        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            status.textContent =
                "🟢 Login successful!";

            setTimeout(function() {
                window.location.href = "dashboard.html";
            }, 1000);

        } catch (error) {

            console.error(error);

            status.textContent =
                "🔴 " + error.message;
        }

    });

</script>

</body>
  </html>
